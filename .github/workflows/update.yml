name: Actualizar stock
on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para actualizar a mano
permissions:
  contents: write
concurrency:
  group: update-stock
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.mjs
      - name: Guardar cambios
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/stock.json
          git diff --staged --quiet || (git commit -m "Actualizar stock" && git push)

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f6f6f3">
<title>Stock Pokémon TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f6f3; --ink:#17171a; --muted:#6b6b72; --line:#dcdcd4;
    --gold:#a67c00;
    --ok:#17794a; --ok-bg:#dff3e7; --pre:#8a5a00; --pre-bg:#fbe9c4;
    --out:#8a8a90; --out-bg:#ecece8; --warn-bg:#fdecec; --warn:#a12a2a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#121214; --ink:#f1f0ea; --muted:#9a9aa2; --line:#2c2c31;
      --gold:#e0b84a;
      --ok:#6fd49c; --ok-bg:#16301f; --pre:#f0c36a; --pre-bg:#3a2e12;
      --out:#8d8d95; --out-bg:#222226; --warn-bg:#3a1a1a; --warn:#f19a9a;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 64px}
  button,input{font:inherit;color:inherit}
  a{color:inherit}

  header{padding:26px 0 16px;border-bottom:3px solid var(--gold)}
  h1{margin:0;font-weight:800;font-size:clamp(28px,8vw,42px);line-height:1.02;letter-spacing:-.02em}
  h1 span{display:block;font-weight:500;font-size:.5em;letter-spacing:0;color:var(--muted);margin-top:8px}
  .stamp{margin-top:14px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stamp b{color:var(--ink);font-weight:700}
  .reload{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
  .reload:hover{border-color:var(--gold)}

  .bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--line)}
  .search{width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 14px;font-size:16px}
  .search:focus-visible,.chip:focus-visible,.reload:focus-visible,a:focus-visible,.crow:focus-visible,.card:focus-visible,.more:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.gold[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}

  .notice{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
  .count{margin:18px 0 0;color:var(--muted);font-size:14px}
  .back{display:inline-block;margin:18px 0 0;font-size:15px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
  .back:hover{border-bottom-color:var(--gold)}
  h2.title{margin:10px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .sub0{margin:4px 0 0;color:var(--muted);font-size:14px}

  .crow{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}
  .crow:hover .cname{border-bottom-color:var(--gold)}
  .cname{font-weight:700;font-size:18px;letter-spacing:-.01em;justify-self:start;border-bottom:1px solid transparent}
  .cdate{grid-column:1;font-size:13px;color:var(--muted)}
  .cstat{grid-row:1/3;grid-column:2;text-align:right;font-size:13px;color:var(--muted)}
  .cstat b{display:block;font-size:15px;color:var(--ok)}
  .cstat b.none{color:var(--out);font-weight:500}

  .group{padding:22px 0 8px;border-bottom:1px solid var(--line)}
  .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h2.gname{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .lang{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
  .tag{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .summary{margin:3px 0 8px;font-size:14px;color:var(--muted)}
  .summary b{color:var(--ok);font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  li.row{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  li.row:first-child{border-top:0}
  li.row.dim .store a{color:var(--muted)}
  .store a{font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
  .store a:hover{border-bottom-color:var(--gold)}
  .price{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:68px}
  .dim .price{font-weight:400;color:var(--muted)}
  .pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill.in_stock{background:var(--ok-bg);color:var(--ok)}
  .pill.preorder{background:var(--pre-bg);color:var(--pre)}
  .pill.out{background:var(--out-bg);color:var(--out)}
  .note{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card{display:block;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}
  .card:hover .gname{border-bottom-color:var(--gold)}
  .card .gname{display:inline;border-bottom:1px solid transparent}
  .card .summary{margin:6px 0 0}
  .card .go{float:right;color:var(--muted);margin-left:10px}
  .range{margin:2px 0 0;font-size:14px;color:var(--muted)}
  .also{margin:6px 0 14px;font-size:13px;color:var(--muted)}
  .also a{margin-left:10px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
  .also a:hover{border-bottom-color:var(--gold)}
  .more{display:block;margin:22px auto 0;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 20px;cursor:pointer}
  .empty{padding:48px 0;text-align:center;color:var(--muted)}
  details.stores{margin-top:28px;font-size:13px;color:var(--muted)}
  details.stores summary{cursor:pointer}
  details.stores p{margin:8px 0 0;line-height:1.7}
  .bad{color:var(--warn)}
  footer{margin-top:22px;font-size:13px;color:var(--muted)}
  @media (max-width:380px){ li.row{grid-template-columns:1fr auto} .pill{grid-column:1/-1;justify-self:start} }
  @media (prefers-reduced-motion:no-preference){ .group,.crow{animation:in .2s ease-out both} @keyframes in{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pokémon TCG<span>Stock en tiendas, últimas colecciones</span></h1>
    <div class="stamp">
      <span id="stamp">Cargando…</span>
      <button class="reload" id="reload" type="button">Recargar</button>
    </div>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Buscar colección, producto o tienda" autocomplete="off" aria-label="Buscar">
    <div class="chips" id="chips"></div>
  </div>

  <div id="notice"></div>
  <div id="view"></div>
  <div id="foot"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const S = { data: null, onlyStock: true, type: 'ALL', lang: 'ALL', q: '', shown: 40 };
const LABEL = { in_stock: 'En stock', preorder: 'Preventa', out: 'Agotado' };
const PAGE = 40;
const eur = n => n == null ? '—' : n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const avail = s => s === 'in_stock' || s === 'preorder';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else e.setAttribute(k, v); }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'hace unos segundos';
  if (m < 60) return `hace ${m} min`;
  const hr = Math.floor(m / 60);
  return hr < 24 ? `hace ${hr} h` : `hace ${Math.floor(hr / 24)} d`;
}

let GROUPS = [], BYCOL = new Map(), COLS = new Map();
function prepare() {
  const d = S.data;
  COLS = new Map(d.cols.map(c => [c.id, c]));
  const gm = new Map(d.groups.map(g => [g.id, { ...g, rows: [] }]));
  for (const it of d.items) gm.get(it.g)?.rows.push(it);
  GROUPS = [...gm.values()].map(g => {
    const on = g.rows.filter(r => avail(r.st));
    const prices = on.map(r => r.p).filter(p => p != null);
    g.nAvail = on.length;
    g.min = prices.length ? Math.min(...prices) : Infinity;
    g.hay = norm(g.n + ' ' + g.rows.map(r => r.s).join(' ') + ' ' + (COLS.get(g.c)?.name || ''));
    return g;
  });
  BYCOL = new Map();
  for (const g of GROUPS) { if (!BYCOL.has(g.c)) BYCOL.set(g.c, []); BYCOL.get(g.c).push(g); }
}

// rutas: #/ (colecciones)  #/c/<id> (dentro de una colección)
const route = () => { const m = location.hash.match(/^#\/c\/([\w-]+)/); return m ? m[1] : null; };
const sortGroups = list => list.sort((a, b) => (b.nAvail > 0) - (a.nAvail > 0) || a.min - b.min || a.n.localeCompare(b.n));

function renderChips(colId) {
  const box = $('#chips');
  box.replaceChildren();
  const stockChip = h('button', { class: 'chip gold', type: 'button', 'aria-pressed': S.onlyStock }, 'Solo con stock');
  stockChip.onclick = () => { S.onlyStock = !S.onlyStock; S.shown = PAGE; render(); };
  box.append(stockChip);
  if (!colId) return;
  const list = BYCOL.get(colId) || [];
  const types = [...new Set(list.map(g => g.t))];
  const langs = [...new Set(list.map(g => g.l))];
  const mk = (label, key, val) => {
    const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': S[key] === val }, label);
    b.onclick = () => { S[key] = val; S.shown = PAGE; render(); };
    return b;
  };
  if (types.length > 1) {
    box.append(mk('Todos los tipos', 'type', 'ALL'));
    for (const t of types) box.append(mk(S.data.typeLabels[t] || t, 'type', t));
  }
  if (langs.length > 1) {
    box.append(mk('Todos los idiomas', 'lang', 'ALL'));
    for (const l of langs) box.append(mk(S.data.langLabels[l] || l, 'lang', l));
  }
}

// Tiendas que no se pueden leer (Carrefour, El Corte Inglés): enlace de búsqueda del producto
function alsoEl(g) {
  const list = S.data.search || [];
  if (!list.length || g.c === 'accesorios' || g.c === 'otros') return null;
  const q = encodeURIComponent('pokemon ' + g.n.replace(/pok[eé]mon|tcg|jcc/gi, ' ').replace(/\s+/g, ' ').trim());
  const p = h('p', { class: 'also' }, 'Mirar a mano en:');
  for (const s of list) p.append(h('a', { href: s.url.replace('{q}', q), target: '_blank', rel: 'noopener noreferrer' }, s.name));
  return p;
}

function cardEl(g, showCol) {
  const summary = h('p', { class: 'summary' });
  if (g.nAvail) summary.append(h('b', {}, `${g.nAvail} de ${g.rows.length} con stock`), ` · desde ${eur(g.min)}`);
  else summary.append(`Agotado en las ${g.rows.length} tiendas vigiladas`);
  return h('a', { class: 'card', href: '#/p/' + encodeURIComponent(g.id) },
    h('div', { class: 'ghead' }, h('h2', { class: 'gname' }, g.n), h('span', { class: 'lang' }, S.data.langLabels[g.l] || g.l)),
    showCol ? h('p', { class: 'tag' }, COLS.get(g.c)?.name || '') : null,
    summary);
}

function groupEl(g, showCol, all) {
  const rows = g.rows.slice().sort((a, b) => avail(b.st) - avail(a.st) || (a.p ?? 1e9) - (b.p ?? 1e9));
  const visible = (S.onlyStock && !all) ? rows.filter(r => avail(r.st)) : rows;
  const summary = h('p', { class: 'summary' });
  if (g.nAvail) summary.append(h('b', {}, `${g.nAvail} de ${g.rows.length} con stock`), ` · desde ${eur(g.min)}`);
  else summary.append(`Agotado en las ${g.rows.length} tiendas vigiladas`);
  const ul = h('ul');
  const gn = norm(g.n);
  for (const r of visible) {
    const li = h('li', { class: 'row' + (avail(r.st) ? '' : ' dim') });
    li.append(
      h('span', { class: 'store' }, h('a', { href: r.u, target: '_blank', rel: 'noopener noreferrer' }, r.s)),
      h('span', { class: 'price' }, eur(r.p)),
      h('span', { class: 'pill ' + r.st }, LABEL[r.st] || r.st));
    const notes = [];
    if (norm(r.n) !== gn) notes.push(r.n);
    if (r.o) notes.push('la tienda no respondió; dato anterior');
    if (notes.length) li.append(h('span', { class: 'note' }, notes.join(' · ')));
    ul.append(li);
  }
  return h('section', { class: 'group' },
    h('div', { class: 'ghead' }, h('h2', { class: 'gname' }, g.n), h('span', { class: 'lang' }, S.data.langLabels[g.l] || g.l)),
    showCol ? h('p', { class: 'tag' }, COLS.get(g.c)?.name || '') : null,
    summary, ul, alsoEl(g));
}

function renderList(root, list, showCol) {
  const page = list.slice(0, S.shown);
  for (const g of page) root.append(cardEl(g, showCol));
  if (list.length > page.length) {
    const b = h('button', { class: 'more', type: 'button' }, `Mostrar más (${list.length - page.length})`);
    b.onclick = () => { S.shown += PAGE; render(); };
    root.append(b);
  }
}

function render() {
  const root = $('#view');
  root.replaceChildren();
  if (!S.data) return;
  const colId = route();
  const q = norm(S.q.trim());

  const pm = location.hash.match(/^#\/p\/([^/]+)/);
  if (pm) {
    $('#chips').replaceChildren();
    const g = GROUPS.find(x => x.id === decodeURIComponent(pm[1]));
    if (!g) { root.append(h('a', { class: 'back', href: '#/' }, '← Todas las colecciones'), h('div', { class: 'empty' }, 'Este producto ya no está en la lista.')); return; }
    const prices = g.rows.map(r => r.p).filter(p => p != null);
    root.append(h('a', { class: 'back', href: '#/c/' + g.c }, '← ' + (COLS.get(g.c)?.name || 'Volver')));
    const el = groupEl(g, false, true);
    if (prices.length) el.querySelector('.ghead').after(h('p', { class: 'range' }, prices.length > 1 ? `Precios entre ${eur(Math.min(...prices))} y ${eur(Math.max(...prices))}` : `Precio: ${eur(prices[0])}`));
    root.append(el);
    return;
  }

  if (colId && COLS.has(colId)) {
    renderChips(colId);
    const col = COLS.get(colId);
    root.append(h('a', { class: 'back', href: '#/' }, '← Todas las colecciones'),
      h('h2', { class: 'title' }, col.name),
      col.label ? h('p', { class: 'sub0' }, col.label) : null);
    let list = (BYCOL.get(colId) || []).filter(g =>
      (S.type === 'ALL' || g.t === S.type) && (S.lang === 'ALL' || g.l === S.lang) && (!q || g.hay.includes(q)));
    if (S.onlyStock) list = list.filter(g => g.nAvail > 0);
    sortGroups(list);
    root.append(h('p', { class: 'count' }, `${list.length} ${list.length === 1 ? 'producto' : 'productos'}` + (S.onlyStock ? ' con stock o en preventa' : '')));
    if (!list.length) root.append(h('div', { class: 'empty' }, S.onlyStock ? 'Ahora mismo no hay stock con estos filtros. Quita "Solo con stock" para ver todo.' : 'No hay resultados.'));
    else renderList(root, list, false);
    return;
  }

  renderChips(null);

  if (q) {
    let list = GROUPS.filter(g => g.hay.includes(q));
    if (S.onlyStock) list = list.filter(g => g.nAvail > 0);
    sortGroups(list);
    root.append(h('p', { class: 'count' }, `${list.length} ${list.length === 1 ? 'resultado' : 'resultados'} en todas las colecciones`));
    if (!list.length) root.append(h('div', { class: 'empty' }, 'Sin resultados. Prueba con otra palabra o quita "Solo con stock".'));
    else renderList(root, list, true);
    return;
  }

  const cols = [...COLS.values()].filter(c => BYCOL.has(c.id)).sort((a, b) => b.sort.localeCompare(a.sort));
  root.append(h('p', { class: 'count' }, 'Elige una colección'));
  for (const c of cols) {
    const gs = BYCOL.get(c.id), n = gs.filter(g => g.nAvail > 0).length;
    root.append(h('a', { class: 'crow', href: '#/c/' + c.id },
      h('span', { class: 'cname' }, c.name),
      c.label ? h('span', { class: 'cdate' }, c.label) : null,
      h('span', { class: 'cstat' },
        h('b', { class: n ? '' : 'none' }, n ? `${n} con stock` : 'Sin stock'),
        `${gs.length} productos`)));
  }
}

function renderFoot(d) {
  const bad = d.stores.filter(s => !s.ok);
  const det = h('details', { class: 'stores' }, h('summary', {}, `Tiendas vigiladas: ${d.stores.length - bad.length} responden${bad.length ? `, ${bad.length} con fallo` : ''}`));
  const p = h('p');
  d.stores.forEach((s, i) => {
    if (i) p.append(' · ');
    p.append(s.ok ? `${s.name} (${s.n})` : h('span', { class: 'bad' }, `${s.name} (fallo: ${s.error})`));
  });
  det.append(p);
  if ((d.search || []).length) det.append(h('p', {}, `Solo enlace de búsqueda (no se puede leer su stock): ${d.search.map(s => s.name).join(', ')}.`));
  for (const s of (d.search || [])) if (s.note) det.append(h('p', {}, `${s.name}: ${s.note}`));
  $('#foot').replaceChildren(det, h('footer', {}, 'Los datos los lee un robot de las páginas de cada tienda. Pueden tener retrasos o errores: confirma siempre en la tienda antes de comprar.'));
}

async function load() {
  $('#stamp').textContent = 'Cargando…';
  try {
    const r = await fetch('data/stock.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.data = await r.json();
    prepare();
    $('#stamp').replaceChildren('Actualizado ', h('b', {}, ago(S.data.updatedAt)));
    const old = (Date.now() - new Date(S.data.updatedAt)) > 3 * 3600 * 1000;
    $('#notice').replaceChildren(...(old ? [h('div', { class: 'notice' }, 'Los datos tienen más de 3 horas. Puede que el robot esté parado; revisa la pestaña Actions en GitHub.')] : []));
    renderFoot(S.data);
  } catch (e) {
    $('#stamp').textContent = 'No se pudieron cargar los datos';
  }
  render();
}

$('#q').addEventListener('input', e => { S.q = e.target.value; S.shown = PAGE; render(); });
window.addEventListener('hashchange', () => { S.type = 'ALL'; S.lang = 'ALL'; S.q = ''; $('#q').value = ''; S.shown = PAGE; render(); window.scrollTo(0, 0); });
$('#reload').addEventListener('click', load);
setInterval(load, 5 * 60 * 1000);
load();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f6f6f3">
<title>Stock 30 Aniversario Pokémon TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f6f3; --ink:#17171a; --muted:#6b6b72; --line:#dcdcd4;
    --gold:#a67c00; --gold-soft:#f1e4b8;
    --ok:#17794a; --ok-bg:#dff3e7; --pre:#8a5a00; --pre-bg:#fbe9c4;
    --out:#8a8a90; --out-bg:#ececE8; --warn-bg:#fdecec; --warn:#a12a2a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#121214; --ink:#f1f0ea; --muted:#9a9aa2; --line:#2c2c31;
      --gold:#e0b84a; --gold-soft:#3a3115;
      --ok:#6fd49c; --ok-bg:#16301f; --pre:#f0c36a; --pre-bg:#3a2e12;
      --out:#8d8d95; --out-bg:#222226; --warn-bg:#3a1a1a; --warn:#f19a9a;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 64px}

  header{padding:28px 0 18px;border-bottom:3px solid var(--gold)}
  h1{margin:0;font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.02;letter-spacing:-.02em}
  h1 span{display:block;font-weight:500;font-size:.5em;letter-spacing:0;color:var(--muted);margin-top:8px}
  .stamp{margin-top:14px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stamp b{color:var(--ink);font-weight:700}
  button,input{font:inherit;color:inherit}
  .reload{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
  .reload:hover{border-color:var(--gold)}

  .bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--line)}
  .search{width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 14px;font-size:16px}
  .search:focus-visible,.chip:focus-visible,.reload:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.gold[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}

  .notice{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
  .count{margin:18px 0 0;color:var(--muted);font-size:14px}

  .group{padding:22px 0 8px;border-bottom:1px solid var(--line)}
  .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .lang{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
  .summary{margin:2px 0 8px;font-size:14px;color:var(--muted)}
  .summary b{color:var(--ok);font-weight:700}

  ul{list-style:none;margin:0;padding:0}
  li.row{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  li.row:first-child{border-top:0}
  li.row.dim .store a{color:var(--muted)}
  .store a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
  .store a:hover{border-bottom-color:var(--gold)}
  .price{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:68px}
  .dim .price{font-weight:400;color:var(--muted)}
  .pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill.in_stock{background:var(--ok-bg);color:var(--ok)}
  .pill.preorder{background:var(--pre-bg);color:var(--pre)}
  .pill.out,.pill.unknown,.pill.error{background:var(--out-bg);color:var(--out)}
  .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}

  .empty{padding:48px 0;text-align:center;color:var(--muted)}
  footer{margin-top:28px;font-size:13px;color:var(--muted)}
  @media (max-width:380px){ li.row{grid-template-columns:1fr auto} .pill{grid-column:1/-1;justify-self:start} }
  @media (prefers-reduced-motion:no-preference){ .group{animation:in .25s ease-out both} @keyframes in{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pokémon TCG<span>30 Aniversario: stock en tiendas</span></h1>
    <div class="stamp">
      <span id="stamp">Cargando…</span>
      <button class="reload" id="reload" type="button">Recargar</button>
    </div>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Buscar producto o tienda" autocomplete="off" aria-label="Buscar">
    <div class="chips" id="chips">
      <button class="chip gold" id="onlyStock" type="button" aria-pressed="true">Solo con stock</button>
      <button class="chip" data-lang="ALL" type="button" aria-pressed="true">Todos los idiomas</button>
      <button class="chip" data-lang="ES" type="button" aria-pressed="false">Español</button>
      <button class="chip" data-lang="EN" type="button" aria-pressed="false">Inglés</button>
    </div>
  </div>

  <div id="notice"></div>
  <p class="count" id="count"></p>
  <main id="list"></main>

  <footer>
    Los datos los lee un robot de las páginas de cada tienda. Puede haber retrasos o errores:
    confirma siempre en la tienda antes de comprar.
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const STATE = { items: [], updatedAt: null, onlyStock: true, lang: 'ALL', q: '' };
const LABEL = { in_stock:'En stock', preorder:'Preventa', out:'Agotado', unknown:'Sin datos', error:'No se pudo leer' };
const LANGNAME = { ES:'Español', EN:'Inglés', JP:'Japonés', ZH:'Chino', KR:'Coreano' };
const eur = n => n == null ? '—' : n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const avail = s => s === 'in_stock' || s === 'preorder';

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === 'class') e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
}

function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'hace unos segundos';
  if (m < 60) return `hace ${m} min`;
  const hr = Math.floor(m / 60);
  if (hr < 24) return `hace ${hr} h`;
  return `hace ${Math.floor(hr / 24)} d`;
}

function render(){
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const q = norm(STATE.q.trim());
  const groups = new Map();
  for (const it of STATE.items){
    if (STATE.lang !== 'ALL' && it.idioma !== STATE.lang) continue;
    if (q && !norm(it.producto + ' ' + it.tienda).includes(q)) continue;
    const key = it.producto + '|' + it.idioma;
    if (!groups.has(key)) groups.set(key, { producto: it.producto, idioma: it.idioma, rows: [] });
    groups.get(key).rows.push(it);
  }
  let list = [...groups.values()].map(g => {
    g.nAvail = g.rows.filter(r => avail(r.status)).length;
    const prices = g.rows.filter(r => avail(r.status) && r.price != null).map(r => r.price);
    g.min = prices.length ? Math.min(...prices) : Infinity;
    return g;
  });
  if (STATE.onlyStock) list = list.filter(g => g.nAvail > 0);
  list.sort((a, b) => (b.nAvail > 0) - (a.nAvail > 0) || a.min - b.min || a.producto.localeCompare(b.producto));

  const root = $('#list');
  root.replaceChildren();
  $('#count').textContent = list.length
    ? `${list.length} ${list.length === 1 ? 'producto' : 'productos'}` + (STATE.onlyStock ? ' con stock o en preventa' : '')
    : '';

  if (!list.length){
    root.append(h('div', {class:'empty'}, STATE.items.length
      ? (STATE.onlyStock ? 'Ahora mismo no hay stock con estos filtros. Quita "Solo con stock" para ver todo.' : 'No hay resultados.')
      : 'Todavía no hay datos. Ejecuta la acción "Actualizar stock" en GitHub.'));
    return;
  }

  for (const g of list){
    const rows = g.rows.slice().sort((a, b) =>
      avail(b.status) - avail(a.status) || (a.price ?? 1e9) - (b.price ?? 1e9));
    const visible = STATE.onlyStock ? rows.filter(r => avail(r.status)) : rows;

    const summary = h('p', {class:'summary'});
    if (g.nAvail){
      summary.append(h('b', {}, `${g.nAvail} de ${g.rows.length} con stock`), ` · desde ${eur(g.min)}`);
    } else {
      summary.append(`Agotado en las ${g.rows.length} tiendas vigiladas`);
    }

    const ul = h('ul');
    for (const r of visible){
      const li = h('li', {class:'row' + (avail(r.status) ? '' : ' dim')});
      li.append(
        h('span', {class:'store'}, h('a', {href:r.url, target:'_blank', rel:'noopener noreferrer'}, r.tienda)),
        h('span', {class:'price'}, eur(r.price)),
        h('span', {class:'pill ' + r.status}, LABEL[r.status] || r.status)
      );
      if (r.status === 'error' && r.lastStatus){
        li.append(h('span', {class:'sub'}, `Última lectura buena: ${LABEL[r.lastStatus].toLowerCase()}`));
      }
      ul.append(li);
    }
    root.append(h('section', {class:'group'},
      h('div', {class:'ghead'}, h('h2', {}, g.producto), h('span', {class:'lang'}, LANGNAME[g.idioma] || g.idioma)),
      summary, ul));
  }
}

async function load(){
  $('#stamp').textContent = 'Cargando…';
  try{
    const r = await fetch('data/stock.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    STATE.items = d.items || [];
    STATE.updatedAt = d.updatedAt;
    const st = $('#stamp');
    st.replaceChildren();
    if (d.updatedAt) st.append('Actualizado ', h('b', {}, ago(d.updatedAt)));
    else st.append('Sin datos todavía');
    const old = d.updatedAt && (Date.now() - new Date(d.updatedAt)) > 3 * 3600 * 1000;
    $('#notice').replaceChildren(...(old ? [h('div', {class:'notice'}, 'Los datos tienen más de 3 horas. Puede que el robot esté parado; revisa la pestaña Actions en GitHub.')] : []));
  }catch(e){
    $('#stamp').textContent = 'No se pudieron cargar los datos';
  }
  render();
}

$('#q').addEventListener('input', e => { STATE.q = e.target.value; render(); });
$('#onlyStock').addEventListener('click', e => {
  STATE.onlyStock = !STATE.onlyStock;
  e.currentTarget.setAttribute('aria-pressed', STATE.onlyStock);
  render();
});
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  STATE.lang = b.dataset.lang;
  document.querySelectorAll('[data-lang]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
$('#reload').addEventListener('click', load);
setInterval(load, 5 * 60 * 1000);
load();
</script>
</body>
</html>
